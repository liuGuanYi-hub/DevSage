name: Bug report
description: 报告一个可以复现的功能或检索问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认没有包含密码、Token、API Key 或 Vault 私密内容。
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python/Node 版本，以及 memory/PostgreSQL 模式
      placeholder: Windows 11 / Python 3.12 / memory
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出项目、角色、问题文本和操作顺序
      placeholder: |
        1. 选择项目 ...
        2. 选择角色 ...
        3. 输入问题 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 引用证据或日志摘要
      description: 只粘贴脱敏后的路径、行号、状态和错误摘要
