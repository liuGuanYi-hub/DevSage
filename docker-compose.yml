services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devsage}
      POSTGRES_USER: ${POSTGRES_USER:-devsage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./data/docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devsage} -d ${POSTGRES_DB:-devsage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/docker/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_LOCAL_EMBEDDING: ${INSTALL_LOCAL_EMBEDDING:-true}
        LOCAL_EMBEDDING_RUNTIME: ${LOCAL_EMBEDDING_RUNTIME:-cpu}
    gpus: ${DOCKER_GPUS:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before starting Docker Compose}
      DEVSAGE_PROJECT_ROOT: /app
      DEVSAGE_GIT_ROOT: /workspace
      DEVSAGE_STORAGE: postgres
      DEVSAGE_CACHE: ${DEVSAGE_CACHE:-redis}
      DEVSAGE_REDIS_URL: redis://redis:6379/0
      DEVSAGE_AUTH_ENABLED: ${DEVSAGE_AUTH_ENABLED:-false}
      DEVSAGE_AUTH_SECRET: ${DEVSAGE_AUTH_SECRET:-replace-with-at-least-32-random-characters}
      DEVSAGE_AUTH_USERS_FILE: ${DEVSAGE_AUTH_USERS_FILE:-config/auth-users.json}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-/models/multilingual-e5-large-qint8}
      LOCAL_EMBEDDING_CACHE: ${LOCAL_EMBEDDING_CACHE:-/models/cache}
      LOCAL_EMBEDDING_BACKEND: ${LOCAL_EMBEDDING_BACKEND:-onnx}
      LOCAL_EMBEDDING_FILE_NAME: ${LOCAL_EMBEDDING_FILE_NAME:-model_qint8_avx512_vnni.onnx}
      LOCAL_EMBEDDING_BATCH_SIZE: ${LOCAL_EMBEDDING_BATCH_SIZE:-16}
      LOCAL_EMBEDDING_EXECUTION_PROVIDER: ${LOCAL_EMBEDDING_EXECUTION_PROVIDER:-}
      DEVSAGE_EXTERNAL_ISSUE_WRITE_ENABLED: ${DEVSAGE_EXTERNAL_ISSUE_WRITE_ENABLED:-false}
      SAMPLE_DATA_ROOT: sample-data
    volumes:
      - ./sample-data:/app/sample-data:ro
      - ./.git:/workspace/.git:ro
      - ./data/manual-models/multilingual-e5-large-qint8:/models/multilingual-e5-large-qint8:ro
      - devsage-approved-notes:/app/data/approved-notes
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  devsage-approved-notes:
